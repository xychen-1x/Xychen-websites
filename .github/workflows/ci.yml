name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Upload generated npm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Audit dependency tree
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=commonjs -e '
            const report = require("./npm-audit.json");
            const vulnerabilities = Object.entries(report.vulnerabilities || {});
            console.log("Dependency audit summary:", JSON.stringify(report.metadata?.vulnerabilities || {}));
            for (const [name, item] of vulnerabilities) {
              console.log(JSON.stringify({
                name,
                severity: item.severity,
                direct: item.isDirect,
                range: item.range,
                fixAvailable: item.fixAvailable,
                via: (item.via || []).map((entry) =>
                  typeof entry === "string" ? entry : {
                    name: entry.name,
                    title: entry.title,
                    url: entry.url,
                    range: entry.range
                  }
                )
              }));
            }
          '

      - name: Type-check Astro project
        run: npm run check

      - name: Build static website
        run: npm run build
